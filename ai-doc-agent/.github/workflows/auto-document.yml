name: AI Documentation Agent

# Triggers automatically on every push to main (i.e. every code change).
# paths-ignore on docs/** + the actor check stop the agent from re-triggering
# itself when it commits generated documentation back to the repo.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch: {}   # lets you also run it manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  document:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need previous commit to compute the diff
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI Documentation Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/agent.py
